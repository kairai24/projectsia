<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS GADGETS - Landing Page</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="landing-page">
        <!-- Background Image with Blur -->
        <div class="background-image"></div>
        
        <!-- Top Navigation Bar -->
        <div class="nav-bar"></div>
        
        <!-- Logo Group -->
        <div class="logo-group">
            <img src="images/logo-133220.png" alt="Logo" class="logo-image">
            <span class="logo-text">NEXUS GADGETS</span>
        </div>
        
        <!-- Sign In Button -->
        <div class="sign-in-button">
            <div class="sign-in-bg"></div>
            <span class="sign-in-text">Sign in</span>
        </div>
        
        <!-- Main Content -->
        <h1 class="heading-line1">Discover the Latest</h1>
        <h1 class="heading-line2">Tech Gadgets</h1>
        
        <p class="description">
            We connect you with next generation smartphones, wearable, and computing solutions.
            Find the most innovative device and power for you digital life.
        </p>
        
        <!-- CTA Button -->
        <div class="cta-button">
            <div class="cta-bg"></div>
            <span class="cta-text">Start Exploring Now </span>
        </div>
    </div>
</body>
</html>
